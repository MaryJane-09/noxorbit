<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 170" role="img" aria-labelledby="title desc">
  <title id="title">NOXORBIT custom geometric wordmark — draft 2</title>
  <desc id="desc">A custom-drawn uppercase geometric wordmark with angular construction, balanced spacing and champagne-gold strokes.</desc>
