<path d="M535 644 C570 540 685 414 810 357" fill="none" stroke="url(#sweep)" stroke-width="2.3"/>
<path d="M752 393 L761 387" fill="none" stroke="#ffe2b0" stroke-width="5" filter="url(#soft)"/>
<g fill="#db9bd9" opacity=".35"><circle cx="390" cy="440" r=".8"/><circle cx="675" cy="275" r=".7"/><circle cx="1120" cy="235" r=".8"/><circle cx="1180" cy="500" r=".6"/><circle cx="280" cy="590" r=".7"/></g>
