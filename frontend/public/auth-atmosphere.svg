<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
<defs>
<radialGradient id="haze"><stop stop-color="#65216f" stop-opacity=".5"/><stop offset=".65" stop-color="#391346" stop-opacity=".16"/><stop offset="1" stop-color="#100918" stop-opacity="0"/></radialGradient>
<radialGradient id="surface" cx=".48" cy=".1" r=".92"><stop stop-color="#52265e"/><stop offset=".24" stop-color="#35133d"/><stop offset=".65" stop-color="#1b0b27"/><stop offset="1" stop-color="#090710"/></radialGradient>
<linearGradient id="horizon" x1="0" y1="0" x2="1" y2=".1"><stop stop-color="#9d47bc" stop-opacity=".25"/><stop offset=".26" stop-color="#f4b4ef"/><stop offset=".5" stop-color="#f6c9c6"/><stop offset=".76" stop-color="#c777e5"/><stop offset="1" stop-color="#5e267e" stop-opacity=".05"/></linearGradient>
<linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#9b4bbb" stop-opacity="0"/><stop offset=".35" stop-color="#ad55c5" stop-opacity=".16"/><stop offset=".69" stop-color="#edb481" stop-opacity=".82"/><stop offset=".78" stop-color="#ffe2ad"/><stop offset="1" stop-color="#d56fdb" stop-opacity="0"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
<filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
<clipPath id="planetclip"><path d="M-180 888 Q185 670 630 856 Q920 1010 1060 1280 L-220 1280Z"/></clipPath>
</defs>
<ellipse cx="190" cy="750" rx="660" ry="470" fill="url(#haze)"/>
<ellipse cx="1310" cy="220" rx="470" ry="430" fill="url(#haze)" opacity=".25"/>
<!-- The horizon sits below the content, rather than cutting through it. -->
<path d="M-180 888 Q185 670 630 856 Q920 1010 1060 1280 L-220 1280Z" fill="url(#surface)"/>
<g clip-path="url(#planetclip)" opacity=".38" fill="none" stroke-linecap="round">
