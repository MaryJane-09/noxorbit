<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" role="img" aria-labelledby="title desc">
  <title id="title">NOXORBIT wordmark concept</title>
  <desc id="desc">A refined uppercase geometric wordmark in champagne gold, with a restrained cut detail in the first O.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C99632"/>
      <stop offset="0.34" stop-color="#F2D477"/>
      <stop offset="0.62" stop-color="#FFE8A0"/>
      <stop offset="1" stop-color="#C18E32"/>
    </linearGradient>
  </defs>
  <g fill="url(#gold)" font-family="'Avenir Next', 'Montserrat', 'Helvetica Neue', sans-serif"
     font-size="82" font-weight="500" letter-spacing="8">
    <text x="28" y="104">NOXORBIT</text>
  </g>
  <!-- A small precision cut gives the first O a quiet signature without competing with the N symbol. -->
  <path d="M174 25 L190 25 L184 32 L168 32 Z" fill="#09080C"/>
</svg>